<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCM Lite - Payslip</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">

        <section class="card no-print">
          <div class="toolbar">
            <div id="emp-pick" class="hidden">
              <label for="p-emp">Employee</label>
              <select id="p-emp"></select>
            </div>
            <div>
              <label for="p-month">Month</label>
              <input type="month" id="p-month">
            </div>
            <button class="btn btn-primary" id="print-btn" type="button" style="align-self:flex-end">Print / Save as PDF</button>
          </div>
        </section>

        <section class="card payslip" id="slip"></section>

      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/employees.js"></script>
  <script src="../js/attendance.js"></script>
  <script src="../js/leave.js"></script>
  <script src="../js/payroll.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/payslip.js"></script>
</body>
</html>
